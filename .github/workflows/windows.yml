name: Windows preview
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [owner-pr-merged]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare verified speech runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/setup-speech-engine.py
          python scripts/setup-translation-runtime.py
      - name: Audit and publish Windows x64
        shell: pwsh
        run: |
          dotnet restore Lokum.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Lokum.Windows -c Release --no-restore -o build/windows/Lokum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Explorer context gestures
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $proof = Join-Path $PWD 'build/context-media-native'
          $process = Start-Process -FilePath $app -ArgumentList @('--context-media-native', ('"' + $proof + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill($true); throw 'Explorer context gesture checks exceeded 90 seconds' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'context-trace.log') -ErrorAction SilentlyContinue; Get-Content (Join-Path $proof 'error.txt'); throw 'Explorer context gestures failed' }
          Get-Content (Join-Path $proof 'verification.json')
      - name: Chrome Ctrl-left-click media and native bridge regression
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-browser-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-chrome-media.py --output build/chrome-dom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-chrome-protocol.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-chrome-shorts.py --output build/chrome-shorts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-chrome-native-host.py build/windows/Lokum/Lokum.exe --output build/chrome-native-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $proof = Join-Path $PWD 'build/chrome-bridge-checks'
          $process = Start-Process -FilePath $app -ArgumentList @('--chrome-bridge-checks', ('"' + $proof + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill($true); throw 'Chrome bridge checks exceeded one minute' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'error.txt'); throw 'Chrome bridge checks failed' }
          Get-Content (Join-Path $proof 'verification.json')
      - name: Verification failures exit cleanly
        shell: pwsh
        run: |
          python scripts/test-verification-runner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline background removal and transparent PNG exports
        shell: pwsh
        run: |
          dotnet run --project windows/Lokum.Verify -c Release -- --background-removal-only --output build/background-removal-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unicode screenshot metadata read edit and removal
        shell: pwsh
        env:
          LOKUM_VERIFY_METADATA_TOOLS: '${{ runner.temp }}\Lokum-Metadata-Tools'
          LOKUM_VERIFY_DOWNLOAD_METADATA: '1'
        run: |
          dotnet run --project windows/Lokum.Verify -c Release -- --metadata-unicode-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Foreground selection and replacement backgrounds
        shell: pwsh
        run: |
          dotnet run --project windows/Lokum.Verify -c Release -- --background-editing-only --output build/background-editing-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/Lokum.Verify -c Release -- --image-workspace-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified media tools and exercise real exports
        shell: pwsh
        env:
          LOKUM_VERIFY_DOWNLOAD_TOOLS: '1'
          LOKUM_VERIFY_TOOLS_DIRECTORY: '${{ runner.temp }}\Lokum-Test-Tools'
        run: |
          dotnet run --project windows/Lokum.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local automatic subtitles and editor preview
        shell: pwsh
        run: |
          python scripts/setup-speech-tests.py build/speech-fixtures --sample-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/setup-translation-tests.py build/translation-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOKUM_TEST_TRANSLATION_MODEL = (Resolve-Path 'build/translation-fixtures').Path
          & build/translation-env/Scripts/python.exe scripts/test-subtitle-translation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOKUM_VERIFY_INSTALL_SPEECH = Join-Path $env:RUNNER_TEMP 'Lokum-Speech-Tests'
          $env:LOKUM_VERIFY_INSTALL_TRANSLATION = Join-Path $env:RUNNER_TEMP 'Lokum-Translation-Tests'
          $env:LOKUM_VERIFY_SPEECH_SAMPLE = (Resolve-Path 'build/speech-fixtures/jfk.wav').Path
          $tools = Join-Path $env:RUNNER_TEMP 'Lokum-Test-Tools'
          $env:LOKUM_VERIFY_FFMPEG = Join-Path $tools 'ffmpeg.exe'
          $env:LOKUM_VERIFY_FFPROBE = Join-Path $tools 'ffprobe.exe'
          dotnet run --project windows/Lokum.Verify -c Release -- --transcription-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Join-Path $PWD 'build/windows/Lokum/Lokum.exe'
          $proof = Join-Path $PWD 'build/subtitle-editor-ui'
          $source = (Get-ChildItem build/transcription-tests -Filter '*.mp4' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $app -ArgumentList @('--subtitle-editor-checks', ('"' + $proof + '"'), ('"' + $source + '"'), ('"' + $tools + '"'), ('"' + $env:LOKUM_VERIFY_INSTALL_SPEECH + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'error.txt'); throw 'Subtitle editor checks failed' }
      - name: Video cut range mute and processed preview regression
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'Lokum-Test-Tools'
          $env:LOKUM_VERIFY_FFMPEG = Join-Path $tools 'ffmpeg.exe'
          $env:LOKUM_VERIFY_FFPROBE = Join-Path $tools 'ffprobe.exe'
          dotnet run --project windows/Lokum.Verify -c Release --no-restore -- --video-workspace-only --output build/video-workspace-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (Resolve-Path 'build/video-workspace-tests/Video with tone.mp4').Path
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $process = Start-Process -FilePath $app -ArgumentList @('--video-workspace-ui', ('"' + (Join-Path $PWD 'build/video-workspace-ui') + '"'), ('"' + $source + '"'), ('"' + $tools + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(180000)) { $process.Kill($true); throw 'Video preview regression exceeded three minutes' }
          if ($process.ExitCode -ne 0) { throw 'Video preview regression failed' }
          Get-Content build/video-workspace-ui/verification.json
      - name: Context media wheel editor routing and clipboard snapshot regression
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $proof = Join-Path $PWD 'build/context-media-checks'
          $process = Start-Process -FilePath $app -ArgumentList @('--context-media-checks', ('"' + $proof + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill($true); throw 'Context media checks exceeded one minute' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'error.txt'); throw 'Context media checks failed' }
          Get-Content (Join-Path $proof 'verification.json')
      - name: Native browser Download Media popup and local file workflow
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $proof = Join-Path $PWD 'build/browser-download-checks'
          $process = Start-Process -FilePath $app -ArgumentList @('--browser-download-checks', ('"' + $proof + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill($true); throw 'Browser download checks exceeded one minute' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'error.txt'); throw 'Browser download checks failed' }
          Get-Content (Join-Path $proof 'verification.json')
      - name: Windows native image PDF ZIP and WPF render checks
        shell: pwsh
        env:
          LOKUM_SMOKE_DIRECTORY: '${{ github.workspace }}\build\windows-smoke'
        run: |
          $proof = $env:LOKUM_SMOKE_DIRECTORY
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /d /c "call `"$vcvars`" && cl /nologo /std:c++20 /EHsc /W4 /DLOKUM_TRACE_LIBRARY /LD windows\Diagnostics\NativeDebugRunner.cpp /Fe:build\NativeShutdownTrace.dll && cl /nologo /std:c++20 /EHsc /W4 windows\Diagnostics\NativeDebugRunner.cpp /Fe:build\NativeDebugRunner.exe /link dbghelp.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics did not compile' }
          python scripts/test-native-trace.py build/NativeShutdownTrace.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics export or output path is invalid' }
          function Invoke-NativeFixture([string] $directory) {
            $env:LOKUM_SMOKE_DIRECTORY = $directory
            New-Item -ItemType Directory -Force $directory | Out-Null
            $start = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path build/windows/Lokum/Lokum.exe))
            $start.UseShellExecute = $false
            $start.ArgumentList.Add('--smoke-test')
            $process = [System.Diagnostics.Process]::Start($start)
            try {
              $processHandle = $process.Handle
              if (!$process.WaitForExit(900000)) {
                $process.Kill($true)
                throw 'Native desktop checks exceeded 15 minutes'
              }
              Write-Host "Native desktop process exit code: $($process.ExitCode); fixture: $directory"
              return $process.ExitCode
            } finally { $process.Dispose() }
          }
          $env:LOKUM_NATIVE_TRACE_LIBRARY = (Resolve-Path build/NativeShutdownTrace.dll).Path
          $exitCode = Invoke-NativeFixture $proof
          if ($exitCode -eq 0) {
            Remove-Item Env:LOKUM_NATIVE_TRACE_LIBRARY
            $exitCode = Invoke-NativeFixture (Join-Path $proof 'second-pass')
          }
          if ($exitCode -ne 0) {
            $hasFrames = $false
            Get-ChildItem $proof -Filter native-exception-stack.txt -Recurse | ForEach-Object {
              if ((Get-Content $_.FullName -Raw) -match "FRAME\t") {
                $hasFrames = $true
                & build/NativeDebugRunner.exe --resolve-stack $_.FullName | Tee-Object -FilePath ($_.FullName + '.resolved.txt')
              }
            }
            if (!$hasFrames) {
              $env:LOKUM_SMOKE_DIRECTORY = Join-Path $proof 'native-debug'
              New-Item -ItemType Directory -Force $env:LOKUM_SMOKE_DIRECTORY | Out-Null
              & build/NativeDebugRunner.exe (Resolve-Path build/windows/Lokum/Lokum.exe) --smoke-test 2>&1 | Tee-Object -FilePath (Join-Path $proof 'native-stack.txt')
            }
            Start-Sleep -Seconds 3
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001,1026; StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue | Select-Object -First 8 TimeCreated,ProviderName,Id,Message | Format-List | Out-String | Write-Host
            throw "Native desktop checks exited with code $exitCode"
          }
          foreach ($directory in @($proof, (Join-Path $proof 'second-pass'))) {
            if (!(Test-Path (Join-Path $directory 'smoke.json'))) { throw 'No native smoke result' }
            Get-Content (Join-Path $directory 'smoke.json')
          }
      - name: Every conversion target previews before saving
        shell: pwsh
        env:
          LOKUM_VERIFY_OFFICE_TOOLS: '${{ runner.temp }}\Lokum-Parity-Runtimes'
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'Lokum-Test-Tools'
          $app = (Resolve-Path 'build/windows/Lokum/Lokum.exe').Path
          $proof = Join-Path $PWD 'build/conversion-workspace-ui'
          $process = Start-Process -FilePath $app -ArgumentList @('--conversion-workspace-ui', ('"' + $proof + '"'), ('"' + $tools + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(600000)) { $process.Kill($true); throw 'Conversion preview regression exceeded ten minutes' }
          if ($process.ExitCode -ne 0) { Get-Content (Join-Path $proof 'error.txt'); throw 'Conversion preview regression failed' }
          $report = Get-Content (Join-Path $proof 'verification.json') -Raw | ConvertFrom-Json
          if (!$report.passed -or !$report.officeAvailable -or $report.formats.Count -ne 39) { throw 'Not all conversion targets were verified' }
          Get-Content (Join-Path $proof 'verification.json')
      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/Lokum/* -DestinationPath build/Lokum-Windows-x64.zip
          Get-FileHash build/Lokum-Windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-preview
          path: |
            build/Lokum-Windows-x64.zip
            build/windows-smoke
            build/background-editing-tests
            build/video-workspace-tests
            build/video-workspace-ui
            build/conversion-workspace-ui
            build/subtitle-editor-ui
            build/context-media-checks
            build/context-media-native
            build/browser-download-checks
            build/chrome-dom
            build/chrome-shorts
            build/chrome-native-host
            build/chrome-bridge-checks
          retention-days: 7
          if-no-files-found: error
