name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [owner-pr-merged]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-engines:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LOKUM_FFMPEG: ${{ github.workspace }}/Tools/ffmpeg
      LOKUM_FFPROBE: ${{ github.workspace }}/Tools/ffprobe
      LOKUM_DENO: ${{ github.workspace }}/Tools/deno
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install verified application runtimes and Office
        run: |
          if [ ! -d /Applications/LibreOffice.app ]; then brew install --cask libreoffice; fi
          scripts/setup-tools.sh
          python3 scripts/setup-web-download-tools.py
          scripts/setup-exiftool.sh
          mkdir -p build/mac-engines
          Tools/ffmpeg -hide_banner -encoders > build/mac-engines/encoders.txt
          grep -qE '[[:space:]]libwebp[[:space:]]' build/mac-engines/encoders.txt
          grep -qE '[[:space:]]libvorbis[[:space:]]' build/mac-engines/encoders.txt
      - name: All macOS engine and update regressions
        run: |
          mkdir -p build/mac-engines
          python3 scripts/setup-speech-tests.py build/speech-fixtures
          export LOKUM_TEST_SPEECH_FIXTURES="$PWD/build/speech-fixtures"
          set -o pipefail
          swift test 2>&1 | tee build/mac-engines/tests.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-engine-results
          path: build/mac-engines
          retention-days: 7
          if-no-files-found: warn
  mac-package:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      LOKUM_FFMPEG: ${{ github.workspace }}/Tools/ffmpeg
      LOKUM_FFPROBE: ${{ github.workspace }}/Tools/ffprobe
      LOKUM_DENO: ${{ github.workspace }}/Tools/deno
      LOKUM_SIGNING_MODE: ad-hoc
      LOKUM_EXTERNAL_TOOLS: 'true'
      LOKUM_UPDATE_CONFIG: Configuration/Updates.public.plist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install verified package test runtimes
        run: |
          if [ ! -d /Applications/LibreOffice.app ]; then brew install --cask libreoffice; fi
          scripts/setup-tools.sh
          scripts/setup-exiftool.sh
      - name: Build and verify the portable macOS app
        run: |
          scripts/build-app.sh release
          codesign --verify --deep --strict build/Lokum.app
      - name: Exercise the app without its build cache
        run: |
          mkdir -p build/mac-package
          task_build_cache="$PWD/build/verification-swift-build"
          test ! -e "$task_build_cache"
          mv .build "$task_build_cache"
          trap 'mv "$task_build_cache" "$PWD/.build"' EXIT
          build/Lokum.app/Contents/MacOS/Lokum tool removeBackground Tests/LokumCoreTests/Fixtures/astronaut.png --options '{"backgroundEditing":{"regions":[],"automatic":true,"fill":"transparent","color":"#FFFFFF","selections":{}},"outputDirectory":"build/mac-package/background"}' --json > build/mac-package/background.json
          build/Lokum.app/Contents/MacOS/Lokum --desktop-feature-smoke build/mac-package/packaged-ui
          ditto -c -k --sequesterRsrc --keepParent build/Lokum.app build/mac-package/Lokum-macOS.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-package
          path: build/mac-package
          retention-days: 7
          if-no-files-found: warn
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated language tables
        run: python3 scripts/generate-localizations.py --check
      - name: Lokum site and update channel regressions
        run: |
          python3 scripts/test-site-generation.py
          python3 scripts/test-update-configuration.py
      - name: Owner merge authorization regressions
        run: python3 scripts/test-owner-auto-merge.py
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Scan full public history for secrets
        run: |
          python3 scripts/scan-secrets.py
          python3 scripts/test-secret-scan.py build/security/gitleaks
  mac-source:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Build native macOS app
        id: mac-build
        run: swift build --product Lokum
      - name: Isolated native UI, accessibility and artwork checks
        run: python3 scripts/test-native-ui.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-native-ui
          path: build/native-ui
          retention-days: 7
          if-no-files-found: warn
      - name: Archive link boundary and extraction regressions
        run: swift test --filter 'ArchiveLinkBoundaryTests|ArchiveResourceLimitsTests|DocumentEngineTests/testArchive|DocumentEngineTests/testZIPTARGZIPRoundTripsNestedFilesAndUnicodeWithoutOverwritingOriginals|DocumentEngineTests/testStoredRARAndOrdinaryGZIPAreReadable|DocumentEngineTests/testCancellationProducesNoPublishedDocumentOrExtractedFolder'
      - name: Update trust, web photo and window placement and setup regressions
        run: swift test --filter 'LokumUpdatesTests|WebMediaDragPayloadTests|InstagramPhotosTests|YouTubeThumbnailTests|WindowPlacementTests|AppLocalizationTests|ToolSetupTests'
      - name: Install FFmpeg for redaction regressions
        if: ${{ !cancelled() && steps.mac-build.outcome == 'success' }}
        run: brew install ffmpeg
      - name: Redaction coverage and image opacity regressions
        run: swift test --filter 'SolidRedactionCoverageTests|ImageRedactionBoundsRegressionTests|ImageColorOpacityRegressionTests|MediaEngineTests/testVideoRedactionStylesAndTemporalBounds'
      - name: Desktop feature parity regressions
        if: ${{ !cancelled() && steps.mac-build.outcome == 'success' }}
        run: swift test --filter 'DesktopParityEngineTests|PlatformReliabilityTests'
      - name: Desktop feature selection and preview routing
        if: ${{ !cancelled() && steps.mac-build.outcome == 'success' }}
        run: |
          scripts/setup-exiftool.sh
          if ! .build/debug/Lokum --desktop-feature-smoke build/desktop-feature-ui; then
            cat build/desktop-feature-ui/error.txt
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-desktop-feature-parity
          path: build/desktop-feature-ui
          retention-days: 7
          if-no-files-found: warn
