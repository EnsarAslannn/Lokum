# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
pull_request_rules:
  - name: "Observe main PRs awaiting a maintainer decision"
    conditions: ["base=main", "-draft"]
    actions: {}
  - name: "Observe all three required check names successful; not merge permission"
    conditions:
      - base=main
      - "-draft"
      - check-success=security
      - check-success=mac-source
      - check-success=windows
    actions: {}
  - name: "Observe sensitive changes requiring explicit human review"
    conditions:
      - base=main
      - "-draft"
      - 'files~=(^\.github/|^\.(coderabbit|mergify)|^Configuration/|^scripts/|^Sources/(LokumUpdates|TangerineUpdates|UpdateCredentialBroker)/|^Sources/LokumCore/(ProcessRunner|ExportTransaction|ArchiveCodec|WebDownload)|(^|/)(Package\.(swift|resolved)|[^/]*\.csproj|[^/]*\.props|packages\.lock\.json|package(-lock)?\.json|SECURITY\.md|AGENTS\.md|CLAUDE\.md)$)'
    actions: {}
  - name: "Observe same-repository Markdown-only CI; still manual"
    conditions:
      - base=main
      - "-draft"
      - "-conflict"
      - "-from-fork"
      - "#files>0"
      - '-files~=^(?!(?:README(?:\.tr)?\.md|docs/(?:[^/]+/)*[^/]+\.md)$).+'
      - check-success=security
      - check-success=mac-source
      - check-success=windows
    actions: {}

commands_restrictions:
  backport:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  copy:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  dequeue:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  queue:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  requeue:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  rebase:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  squash:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  update:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin", "#files<0"]
  refresh:
    conditions: ["sender=EnsarAslannn", "sender-permission=admin"]
